name: Generate PHPStan baseline

# Tek seferlik araç: mevcut PHPStan hatalarını phpstan-baseline.neon'a yazar ve commit'ler.
# Baseline olmadan yeni hatalar CI'yi kırar (bkz. static-analysis.yml).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate baseline
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Download PHPStan
        run: curl -fsSL -o phpstan.phar https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar

      - name: Generate baseline
        run: php phpstan.phar analyse -c phpstan.neon --generate-baseline phpstan-baseline.neon --no-progress --memory-limit=1G

      - name: Include baseline in config
        run: |
          if ! grep -q "phpstan-baseline.neon" phpstan.neon; then
            printf 'includes:\n    - phpstan-baseline.neon\n' > /tmp/inc.tmp
            cat /tmp/inc.tmp phpstan.neon > phpstan.neon.tmp && mv phpstan.neon.tmp phpstan.neon
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phpstan-baseline.neon phpstan.neon
          git commit -m "chore: add PHPStan baseline" || echo "nothing to commit"
          git push
